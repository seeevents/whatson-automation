name: WhatsOn - Test Publication (isolé)

on:
  workflow_dispatch:
    inputs:
      record_id:
        description: "ID de l'enregistrement Airtable a tester (ex: recXXXXXXXXXXXXXX) - un seul, jamais la vraie file"
        required: true
        type: string

jobs:
  publication-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dependances
        run: pip install -r requirements.txt

      - name: Lancer la Publication en mode test
        env:
          AIRTABLE_API_KEY: ${{ secrets.AIRTABLE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
        run: python scripts/run_publication_test.py "${{ inputs.record_id }}"
