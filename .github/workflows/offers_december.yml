name: WhatsOn - Offres (reconduction de decembre)
on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 2 1 12 *"   # 1er decembre, 10:00 Bali
jobs:
  offers-december:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Reconduire les offres sur decembre
        env:
          AIRTABLE_API_KEY: ${{ secrets.AIRTABLE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OFFERS_WRITE_ENABLED: "true"
          ALLDAY_CONVENTION_ENABLED: "true"
          OFFERS_UPDATE_MODE: "full"   # prolonge end_date au dernier jour du mois pour les fins posees par defaut
          OFFERS_HOLD_VENUES: "Tabu Bali"
        run: python scripts/run_offers.py 30
