name: WhatsOn - Backfill meta branding (une fois)

on:
  workflow_dispatch:
    inputs:
      event_ids:
        description: "IDs GoodBarber separes par des espaces"
        required: true
        type: string

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dependances
        run: pip install -r requirements.txt

      - name: Lancer le backfill
        env:
          AIRTABLE_API_KEY: ${{ secrets.AIRTABLE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
          GOODBARBER_MCP_OAUTH_STATE: ${{ secrets.GOODBARBER_MCP_OAUTH_STATE }}
        run: python scripts/backfill_meta_branding.py ${{ inputs.event_ids }}
