name: WhatsOn - Offres (passage hebdomadaire par venue)
on:
  workflow_dispatch:
    inputs:
      write:
        description: "true = ecrire dans venue_offers"
        default: "true"
      batches:
        description: "Batches (JSON), ex: [1,2,3,4,5,6,7,8]"
        default: "[1,2,3,4,5,6,7,8]"
jobs:
  offers-scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        batch: ${{ fromJSON(inputs.batches || '[1,2,3,4,5,6,7,8]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Offres batch ${{ matrix.batch }}
        env:
          AIRTABLE_API_KEY: ${{ secrets.AIRTABLE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OFFERS_WRITE_ENABLED: ${{ inputs.write || 'true' }}
          ALLDAY_CONVENTION_ENABLED: "true"
          OFFERS_HOLD_VENUES: ""
        run: python scripts/run_offers_scrape.py ${{ matrix.batch }}
