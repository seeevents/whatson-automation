name: WhatsOn - Test Resolve Client (lecture seule)

on:
  workflow_dispatch:
    inputs:
      venue_name:
        description: "Nom de la venue a chercher (ex: Klymax Discotheque)"
        required: true
        type: string

jobs:
  test-resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dependances
        run: pip install -r requirements.txt

      - name: Tester resolve_client_file
        env:
          MICROSOFT_CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}
          MICROSOFT_CLIENT_SECRET: ${{ secrets.MICROSOFT_CLIENT_SECRET }}
          MICROSOFT_TENANT_ID: ${{ secrets.MICROSOFT_TENANT_ID }}
        run: python scripts/test_resolve_client.py "${{ inputs.venue_name }}"
