name: WhatsOn - Tri Automatisé

on:
  workflow_dispatch: {}
  schedule:
    - cron: "40 4 * * *"  # 12:40 Bali (UTC+8), apres la fin normale des 8 batches
    - cron: "55 4 * * *"  # 12:55 Bali, filet de securite si volume important

jobs:
  tri:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Lancer le Tri
        env:
          AIRTABLE_API_KEY: ${{ secrets.AIRTABLE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
        run: python scripts/run_tri.py
