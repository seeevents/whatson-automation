name: WhatsOn - Test oEmbed Instagram (lecture seule)

on:
  workflow_dispatch:
    inputs:
      post_url:
        description: "URL d'un post Instagram public (ex: https://www.instagram.com/p/XXXXX/)"
        required: true
        type: string

jobs:
  test-oembed:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dependances
        run: pip install -r requirements.txt

      - name: Tester oEmbed
        run: python scripts/test_oembed.py "${{ inputs.post_url }}"
